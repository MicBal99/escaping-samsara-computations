name: Re-run discovery solvers

on:
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/solve_method1_1d.py
      - run: PYTHONPATH=. python scripts/solve_method1_2d.py
      - run: PYTHONPATH=. python scripts/solve_method2_b4s2.py
